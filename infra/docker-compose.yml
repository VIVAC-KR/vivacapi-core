services:
  api:
    # deploy.yml이 IMAGE_TAG를 주입해 마이그레이션과 같은 버전 이미지를 띄운다.
    # latest 폴백 금지 — 로컬에 오래된 latest 이미지가 캐시돼있으면 pull 없이
    # 그대로 재사용돼 구버전이 조용히 떠버린다. 수동 운영 시에도 반드시
    # IMAGE_TAG=vX.Y.Z를 명시할 것.
    image: vivacadmin/vivacapi-core:${IMAGE_TAG:?IMAGE_TAG must be set explicitly, e.g. IMAGE_TAG=v0.20.2 (never rely on a latest fallback)}
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    networks:
      - vivac-network
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /vivac/api
        awslogs-stream: fastapi
        awslogs-create-group: "true"

  redis:
    image: redis:7-alpine
    # 캐시 전용(영속 데이터 없음) — 상한 없이 두면 t2.micro 1GB를 api와
    # 나눠 쓰다 OOM killer에 물린다. 버전 프리픽스 무효화 방식이라 구버전
    # 키도 TTL까지 남으므로 상한 도달 시 LRU로 밀어내게 한다.
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: always
    networks:
      - vivac-network
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /vivac/api
        awslogs-stream: redis
        awslogs-create-group: "true"

networks:
  vivac-network:
    external: true
